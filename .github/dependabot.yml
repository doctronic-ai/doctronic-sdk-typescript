# Version updates wait 14 days after a release, so every dependency is at least two weeks old.
# The cooldown doesn't apply to security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # The SDK supports Node >= 20 ("engines" in package.json), so the Node types stay on
      # major 20. Minor and patch updates still come through.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A TypeScript major needs openapi-typescript, typescript-eslint and tsup to support it
      # first. We revisit it by hand.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
