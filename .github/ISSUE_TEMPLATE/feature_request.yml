name: Feature request
description: Suggest an improvement to the SDK.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Never post API tokens, webhook secrets, patient data, or PHI in an issue.** Issues are public.

        The SDK follows the published API contract, so a new API operation or field arrives in the SDK after it's in the contract. Requests about the SDK itself, such as its methods, types, retries, or packaging, belong here.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind, with example code if it helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds or other approaches you considered.
  - type: checkboxes
    id: no-sensitive-data
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no API tokens, webhook secrets, patient data, or PHI.
          required: true
